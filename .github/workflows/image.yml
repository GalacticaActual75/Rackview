name: Publish Rackview image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'compose.yaml'
      - 'compose.truenas.yaml'
      - '.github/workflows/image.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: rackview-image
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test Rackview
        run: docker run --rm --network none -v "$PWD:/src:ro" -w /src node:24-trixie-slim node --test
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Build and publish
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx create --driver docker-container --use
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx bake -f compose.yaml -f - --push rackview <<EOF
          target "rackview" {
            platforms = ["linux/amd64", "linux/arm64"]
            tags = ["$image:latest", "$image:sha-$GITHUB_SHA"]
            labels = {
              "org.opencontainers.image.source" = "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
              "org.opencontainers.image.revision" = "$GITHUB_SHA"
            }
          }
          EOF
      - name: Test the standalone Compose install
        run: |
          compose=(docker compose -p rackview-install-check -f compose.truenas.yaml)
          "${compose[@]}" pull
          "${compose[@]}" up -d --wait --wait-timeout 90
          curl --fail --silent http://localhost:8080/healthz | jq -e '.ok == true'
          curl --fail --silent --user admin:admin http://localhost:8080/api/status | jq -e '.setupRequired == true'
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://localhost:8080/api/status)" = 401
          "${compose[@]}" exec -T rackview sh -c 'test "$(id -u)" = 1000 && touch /var/lib/rackview/.install-check'
          "${compose[@]}" up -d --force-recreate --wait --wait-timeout 90
          "${compose[@]}" exec -T rackview test -f /var/lib/rackview/.install-check
