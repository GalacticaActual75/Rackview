services:
  rackview:
    build:
      context: .
      dockerfile_inline: |
        FROM node:24-trixie-slim
        RUN apt-get update \
            && apt-get install -y --no-install-recommends ipmitool node-ws novnc \
            && rm -rf /var/lib/apt/lists/* \
            && install -d -m 0700 -o node -g node /var/lib/rackview
        WORKDIR /app
        COPY server.mjs ipmi.mjs console.mjs ./
        COPY web/ ./web/
        ENV DATA_DIR=/var/lib/rackview
        USER node
        EXPOSE 8080
        CMD ["node", "server.mjs"]
    image: rackview-ipmi:local
    pull_policy: build
    init: true
    restart: unless-stopped
    ports:
      - "${RACKVIEW_BIND:+${RACKVIEW_BIND}:}${RACKVIEW_PORT:-8080}:8080"
    environment:
      DASHBOARD_USER: "${DASHBOARD_USER:-}"
      DASHBOARD_PASSWORD: "${DASHBOARD_PASSWORD:-}"
    volumes:
      - connection:/var/lib/rackview
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  connection:
